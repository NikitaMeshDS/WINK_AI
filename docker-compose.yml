version: '3.8'

services:
  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app/frontend
    networks:
      - winkai-net
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - ML_API_URL=https://v672ahj5imtgdl-8000.proxy.runpod.net
    volumes:
      - ./backend:/app/backend
      - ./backend/uploads:/app/uploads
      - ./backend/results:/app/results
      - ./backend/data:/app/data
    networks:
      - winkai-net
    extra_hosts:
      - 'host.docker.internal:host-gateway'

networks:
  winkai-net:
    driver: bridge
