version: '3.8'
services:
  winkai:
    build: .
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/results:/app/results
    env_file:
      - .env
    depends_on:
      - ml_app

  ml_app:
    build:
      context: ./ML_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - winkai
