server {
    listen 80;
    server_name misishacks.misishacks.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name misishacks.misishacks.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    # Увеличиваем максимальный размер файла (у вас уже есть)
    client_max_body_size 1024M;

    location / {
        # Указываем, куда перенаправлять запросы (у вас уже есть)
        proxy_pass http://winkai:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
  
        # Увеличиваем таймауты, чтобы Nginx не обрывал соединение
        proxy_connect_timeout       300s;
        proxy_send_timeout          300s;
        proxy_read_timeout          300s;
        send_timeout                300s;
    }
}